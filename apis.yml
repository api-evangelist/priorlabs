aid: priorlabs
name: Prior Labs
description: >-
  Prior Labs builds TabPFN, a tabular foundation model that delivers strong predictions on
  structured/tabular data in seconds — no dataset-specific training, tuning, or ML pipelines
  required. TabPFN-3 handles classification, regression, time-series forecasting, anomaly
  detection, synthetic data generation, embeddings, and uncertainty quantification via in-context
  learning, scaling to 1M rows, 2,000 columns, and 160 classes. Prior Labs exposes TabPFN through
  a cloud REST API (api.priorlabs.ai), Python and R client SDKs, a Model Context Protocol server
  for AI agents, and private deployments on AWS SageMaker, Databricks, and Azure AI Foundry. The
  company was published in Nature and is now part of SAP.
